[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnloop"
version = "1.0.0"
description = "Lokalna aplikacja webowa do planowania nauki i zapisywania sesji."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools]
packages = ["learnloop"]
include-package-data = true

[tool.setuptools.package-data]
learnloop = ["schema.sql", "templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

